<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open Olea canvas</title>
  <style>body{font:16px/1.6 system-ui,sans-serif;color:#283524;background:#f7f8f5;max-width:560px;margin:12vh auto;padding:24px}h1{font-size:24px}a,button{color:#415739}a{display:inline-block;padding:10px 0}button{font:inherit;cursor:pointer;padding:8px 12px;border:1px solid #cbd2c2;background:#fff;border-radius:6px}code{background:#e6eddf;padding:2px 6px}</style>
</head>
<body>
  <h1>Olea canvas</h1>
  <p>Start the canvas with <code>start.cmd</code> in this folder, or run <code>npm install</code> then <code>npm start</code>.</p>
  <a id="open" href="http://127.0.0.1:4173/app.html">Open canvas</a>
  <p id="migration" hidden>Your previous cards are ready to import when you open the canvas. The original saved board stays here.</p>
  <button id="backup" hidden>Download previous board</button>
  <script>
    if (location.protocol !== 'file:') location.replace(new URL('app.html',location.href).href);
    try {
      const saved = localStorage.getItem('olea-project-board-v1');
      if (saved) {
        JSON.parse(saved);
        document.querySelector('#open').hash = new URLSearchParams({'olea-board':saved}).toString();
        document.querySelector('#migration').hidden = false;
        const backup = document.querySelector('#backup'); backup.hidden = false;
        backup.onclick = () => {
          const url = URL.createObjectURL(new Blob([saved],{type:'application/json'}));
          const link = document.createElement('a'); link.href=url; link.download='olea-board-backup.json'; link.click();
          setTimeout(()=>URL.revokeObjectURL(url),1000);
        };
      }
    } catch { document.querySelector('#migration').hidden=false; document.querySelector('#migration').textContent='Previous board data could not be read. It has not been changed.'; }
  </script>
</body>
</html>
