<!doctype html>
<html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-src 'none'; child-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="https://olea.invalid/xterm.css"><style>html,body,#terminal{position:fixed;inset:0;width:100vw;height:100dvh;min-height:0;overflow:hidden;background:#283220}.xterm{position:absolute;inset:0;width:100%;height:100%;padding:20px;box-sizing:border-box}.xterm-viewport{overscroll-behavior:contain}</style></head><body><div id="terminal"></div><script src="https://olea.invalid/xterm.js"></script><script>
'use strict';
const terminal=new Terminal({cursorBlink:true,convertEol:false,fontFamily:'monospace',fontSize:12,lineHeight:1.9,scrollback:5000,theme:{background:'#283220',foreground:'#eaf0de',cursor:'#bed29b',selectionBackground:'#3e4d32'}});
terminal.open(document.getElementById('terminal'));
terminal.onData(data=>OleaTerminal.input(data));
function fit(){const root=document.getElementById('terminal');for(const element of [document.documentElement,document.body,root]){element.style.position='fixed';element.style.left='0px';element.style.top='0px';element.style.margin='0px';element.style.width=innerWidth+'px';element.style.height=innerHeight+'px';element.style.overflow='hidden'}const cell=terminal._core?terminal._core._renderService.dimensions.css.cell:null;const bounds=root.getBoundingClientRect();if(!cell||!cell.width||!cell.height||!bounds.width||!bounds.height)return;const columns=Math.max(20,Math.floor((bounds.width-40)/cell.width));const rows=Math.max(4,Math.floor((bounds.height-40)/cell.height));if(terminal.cols!==columns||terminal.rows!==rows){terminal.resize(columns,rows);OleaTerminal.resize(columns,rows)}}
window.addEventListener('resize',fit);
// WebView viewport changes already dispatch resize; observing this root while fit resizes it causes observer loops.
terminal.onResize(()=>{});
window.oleaWrite=(data,reset)=>{if(reset)terminal.reset();terminal.write(data)};
window.oleaKey=data=>{terminal.focus();OleaTerminal.input(data)};
window.oleaFocus=()=>terminal.focus();
window.oleaTheme=(theme,fontSize)=>{terminal.options.theme=theme;terminal.options.fontSize=fontSize;for(const e of [document.documentElement,document.body,document.getElementById('terminal')])e.style.background=theme.background;fit()};
setTimeout(()=>{fit();OleaTerminal.ready()},100);
</script></body></html>
