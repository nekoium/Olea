<!doctype html>
<html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-src 'none'; child-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="https://olea.invalid/xterm.css"><style>html,body,#terminal{margin:0;width:100%;height:100%;overflow:hidden;background:#171b16}.xterm{padding:8px;box-sizing:border-box;height:100%}.xterm-viewport{overscroll-behavior:contain}</style></head><body><div id="terminal"></div><script src="https://olea.invalid/xterm.js"></script><script>
'use strict';
const terminal=new Terminal({cursorBlink:true,convertEol:false,fontFamily:'monospace',fontSize:14,scrollback:5000,theme:{background:'#171b16',foreground:'#dfebd5',cursor:'#afc69f',selectionBackground:'#526449'}});
terminal.open(document.getElementById('terminal'));
terminal.onData(data=>OleaTerminal.input(data));
function fit(){const cell=terminal._core?terminal._core._renderService.dimensions.css.cell:null;if(!cell||!cell.width||!cell.height)return;const columns=Math.max(20,Math.floor((innerWidth-18)/cell.width));const rows=Math.max(4,Math.floor((innerHeight-16)/cell.height));if(terminal.cols!==columns||terminal.rows!==rows){terminal.resize(columns,rows);OleaTerminal.resize(columns,rows)}}
new ResizeObserver(fit).observe(document.body);
terminal.onResize(()=>{});
window.oleaWrite=(data,reset)=>{if(reset)terminal.reset();terminal.write(data)};
window.oleaKey=data=>{terminal.focus();OleaTerminal.input(data)};
window.oleaFocus=()=>terminal.focus();
setTimeout(()=>{fit();OleaTerminal.ready()},100);
</script></body></html>
