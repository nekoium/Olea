<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olea · Experience map options</title><style>
:root{font:14px/1.4 system-ui,sans-serif;color:#242c22;background:#eeefe9;--line:#cbd2c2;--accent:#415739;--surface:#fafbf8;--muted:#58634f}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:flex;flex-direction:column}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #99641f;outline-offset:3px}header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:18px;margin:0}header span{font-size:12px;color:var(--muted)}nav{display:flex;gap:8px;padding:12px 22px}nav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px}nav button[aria-pressed=true]{background:var(--accent);color:white;border-color:var(--accent)}.intro{padding:0 22px 12px;display:flex;gap:18px;align-items:baseline}.intro h2{font-size:18px;margin:0}.intro p{margin:0;color:var(--muted)}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,31%);gap:18px;padding:0 22px 16px;flex:1;min-height:0}.map{border:1px solid var(--line);border-radius:12px;min-width:0;min-height:0;overflow:auto;background:#f5f6f0;padding:18px}.map h3{margin:0;font-size:14px}.group+.group{margin-top:24px}.grouphead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}.grouphead small{color:var(--muted)}.cards{display:flex;flex-wrap:wrap;gap:18px}.card{width:88px;flex:none;background:transparent;border:0;padding:0;text-align:left;position:relative}.card img{width:100%;height:auto;display:block;border:2px solid var(--line);border-radius:8px}.card.selected img{border-color:var(--accent);box-shadow:0 0 0 2px #41573922}.card b{display:block;font-size:11px;font-weight:600;margin-top:6px}.card small{display:block;font-size:10px;color:var(--muted);margin-top:3px}.placeholder{width:88px;height:169px;border:1px dashed #abb59e;border-radius:8px;background:#e9ede2;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;color:var(--muted);text-align:center;padding:8px}.placeholder span{font-size:20px}.phonepane{min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px;border-left:1px solid var(--line);padding-left:18px}.controls{display:flex;gap:8px;align-items:center;justify-content:center;flex:none;font-size:12px}.controls button{background:var(--surface);border:1px solid var(--line);padding:7px 12px;border-radius:6px}.stage{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}.stage img{max-height:100%;max-width:100%;width:auto;object-fit:contain;border:1px solid #aeb8a4;border-radius:22px}.detail{width:100%;max-height:98px;overflow:auto;flex:none;text-align:center}.detail b{font-size:13px}.detail p{font-size:12px;color:var(--muted);margin:4px 0}.journeys{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.journeys button{padding:7px 10px;border:1px solid var(--line);border-radius:20px;background:transparent;font-size:12px}.journeys button.active{background:var(--accent);color:white}.journeys i{font-style:normal;align-self:center;color:#8a967f}.lanes{display:grid;gap:22px}.lane{border-top:1px solid var(--line);padding-top:13px}.lane .cards{flex-wrap:nowrap;align-items:flex-start;gap:0}.connector{width:28px;flex:none;align-self:flex-start;margin-top:75px;text-align:center;color:#80916f;font-size:21px}.lane p{font-size:12px;color:var(--muted);margin:4px 0 14px}.canvas{position:relative;width:810px;height:510px;background-image:radial-gradient(#cbd2c2 1px,transparent 1px);background-size:18px 18px}.canvas svg{position:absolute;inset:0;pointer-events:none}.node{position:absolute}.node .card{width:88px}.node .label{font-size:11px;font-weight:600;background:#f5f6f0;margin-bottom:7px}.branchlabel{position:absolute;font-size:10px;color:var(--muted);background:#f5f6f0;padding:2px 5px}.legend{font-size:11px;color:var(--muted);margin-top:16px}.badge{font-size:10px;padding:2px 6px;border:1px dashed #a6b198;border-radius:4px}.emptyjourney{padding:18px;background:#e9ede2;border-radius:8px;font-size:13px;color:var(--muted)}@media(max-width:800px){header span{display:none}header,nav{padding-left:12px;padding-right:12px}nav{gap:5px}nav button{padding:8px;font-size:12px}.intro{display:block;padding-left:12px}.intro p{font-size:12px;margin-top:4px}main{padding:0 12px 12px;gap:10px;grid-template-columns:minmax(0,1fr) 32%}.map{padding:12px}.phonepane{padding-left:10px}.card,.placeholder{width:74px}.placeholder{height:142px}.controls{font-size:10px}.controls button{padding:5px}.connector{width:20px}.detail p{font-size:11px}}
</style></head><body>
<header><h1>Olea · Experience map options</h1><span>Layout study · Same scenarios in every option · No product behavior changed</span></header>
<nav aria-label="Layout options"><button data-mode="gallery" onclick="setMode('gallery')">A · Categorized gallery</button><button data-mode="canvas" onclick="setMode('canvas')">B · Connected flow canvas</button><button data-mode="journey" onclick="setMode('journey')">C · Journey rows</button></nav>
<div class="intro"><h2 id="heading"></h2><p id="description"></p></div>
<main><section class="map" id="map" aria-label="Experience overview"></section><aside class="phonepane"><div class="controls"><span>Selected scenario</span><button onclick="selectScenario(selected)">Reset preview</button></div><div class="stage"><img id="phone" src="scenarios-02/draft.jpg" alt="Selected scenario phone screenshot"></div><div class="detail"><b id="selectedTitle"></b><p id="selectedDetail"></p><p>Screenshot preview · Explore the layout by selecting cards.</p></div></aside></main>
<script>
const data={draft:['New conversation','Choose agent and workspace before sending.'],working:['Tool activity','Inspect tool details while the agent works.'],stopped:['Interrupt task','Stop the current task and review the outcome.'],chat:['Resume task','Return to the existing conversation.'],history:['Find conversation','Find and reopen a saved conversation.'],workspaces:['Switch workspace','Choose a workspace to see its conversations.'],error:['Connection loss','Keep the transcript and show the interruption.']};
const descriptions={gallery:['Browse by category','All scenario groups together. Easy to scan; no sequence or branching.'],canvas:['Follow the connections','Paths and recovery branches stay visible. Pan inside the map to explore.'],journey:['Read one journey at a time','A compact overview above connected scenario rows. Recommended for growing coverage.']};
let selected='draft',mode='gallery',journey='daily';
function card(key){return `<button class="card ${selected===key?'selected':''}" data-key="${key}" onclick="selectScenario('${key}')"><img src="scenarios-02/${key}.jpg" alt=""><b>${data[key][0]}</b></button>`}
function proposed(title){return `<div><div class="placeholder"><span>＋</span>${title}</div><small class="badge">Needs design</small></div>`}
function group(title,keys){return `<section class="group"><div class="grouphead"><h3>${title}</h3><small>${keys.length} scenarios</small></div><div class="cards">${keys.map(card).join('')}</div></section>`}
function chain(keys){return keys.map((key,i)=>(i?`<span class="connector" aria-hidden="true">${key==='error'&&keys[i-1]==='stopped'?'or':'→'}</span>`:'')+card(key)).join('')}
function lane(title,description,keys){return `<section class="lane"><h3>${title}</h3><p>${description}</p><div class="cards">${chain(keys)}</div></section>`}
function canvas(){const nodes=[['draft',24,20],['working',228,20],['chat',452,20],['history',672,20],['stopped',228,294],['error',452,294],['workspaces',672,294]];return `<div class="canvas"><svg width="810" height="510" viewBox="0 0 810 510" aria-label="Connections between scenarios"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8b9a7f"/></marker></defs><g fill="none" stroke="#8b9a7f" stroke-width="1.5" marker-end="url(#arrow)"><path d="M115 119H221"/><path d="M320 119H445"/><path d="M544 119H665"/><path d="M272 238V284"/><path d="M320 160H388V362H445"/><path d="M496 294V243"/><path d="M716 294V242"/></g></svg><span class="branchlabel" style="left:141px;top:96px">Send</span><span class="branchlabel" style="left:345px;top:96px">Complete</span><span class="branchlabel" style="left:568px;top:96px">Return later</span><span class="branchlabel" style="left:277px;top:255px">Interrupt</span><span class="branchlabel" style="left:394px;top:250px">Connection lost</span>${nodes.map(([key,x,y])=>`<div class="node" style="left:${x}px;top:${y}px"><div class="label">${key==='draft'?'Start here':key==='stopped'?'Alternate outcome':key==='error'?'Recovery':key==='workspaces'?'Navigation':''}</div>${card(key)}</div>`).join('')}</div><p class="legend">Connections illustrate possible journeys, not a mandatory sequence.</p>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.getElementById('heading').textContent=descriptions[mode][0];document.getElementById('description').textContent=descriptions[mode][1];let html='';if(mode==='gallery')html=group('Start & continue',['draft','chat'])+group('Work & recover',['working','stopped','error'])+group('Find & navigate',['history','workspaces'])+'<p class="legend">First use, phone access and settings remain to be designed.</p>';if(mode==='canvas')html=canvas();if(mode==='journey'){html=`<div class="journeys" aria-label="Experience areas">${[['setup','First use'],['daily','Daily work'],['return','Return & navigate'],['access','Phone access'],['settings','Settings']].map(([key,title],i)=>(i?'<i>·</i>':'')+`<button class="${journey===key?'active':''}" onclick="setJourney('${key}')">${title}</button>`).join('')}</div>`;if(journey==='daily')html+=lane('Start and work','The main path from a new task to a result.',['draft','working','chat'])+lane('When work is interrupted','Branches from working; recovery stays connected to the conversation.',['working','stopped','error']);else if(journey==='return')html+=lane('Find your way back','Choose a scope, find a conversation and continue.',['workspaces','history','chat']);else html+='<div class="emptyjourney">Proposed coverage · Screens and ordering are still open.</div><div class="cards" style="margin-top:18px">'+(journey==='setup'?['Prepare environment','Choose/install agent','Configure provider']:journey==='access'?['Request access','Android permission','Return / resolve denial']:['Agent configuration','Environment status','Launch preference']).map(proposed).join('')+'</div>';html+='<p class="legend">Choose an experience area above. Solid screenshots are existing studies; dashed tiles need design.</p>'}document.getElementById('map').innerHTML=html;updateSelection()}
function updateSelection(){document.querySelectorAll('.card').forEach(b=>{b.classList.toggle('selected',b.dataset.key===selected);b.setAttribute('aria-pressed',String(b.dataset.key===selected))});document.getElementById('phone').src=`scenarios-02/${selected}.jpg`;document.getElementById('selectedTitle').textContent=data[selected][0];document.getElementById('selectedDetail').textContent=data[selected][1]}
function selectScenario(key){selected=key;updateSelection()}
function setJourney(key){journey=key;render()}
function setMode(key){mode=key;history.replaceState(null,'','#'+key);render()}
if(descriptions[location.hash.slice(1)])mode=location.hash.slice(1);render();
</script></body></html>
